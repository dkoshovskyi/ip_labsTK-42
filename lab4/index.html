<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student card FORM</title>
    <style>
        div {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h2>Student card FORM</h2>
    </header>

    <main>
        <section>
            <form action="." method="post" enctype="multipart/form-data">
                <h3>Personal Information</h3>
                <fieldset>
                    <legend>Provide your details</legend>

                    <div>
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" value="" required>
                    </div>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" value="" required>
                    </div>

                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter a password" required>
                    </div>

                    <div>
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" min="0" max="120" required>
                    </div>

                    <div>
                        <label for="date">Date of Birth:</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div>
                        <label>Gender:</label><br>
                        <input type="radio" id="male" name="gender" value="male" checked>
                        <label for="male">Male</label><br>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label><br>
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Other</label>
                    </div>

                    <div>
                        <label>Languages Known:</label><br>
                        <input type="checkbox" id="languages1" name="languages" value="english" checked>
                        <label for="languages1">English</label><br>
                        <input type="checkbox" id="languages2" name="languages" value="spanish">
                        <label for="languages2">Spanish</label><br>
                        <input type="checkbox" id="languages3" name="languages" value="french">
                        <label for="languages3">French</label>
                    </div>

                    <div>
                        <label for="country">Country:</label>
                        <select id="country" name="country" required>
                            <option value="">Select your country</option>
                            <option value="ukraine" selected>Ukraine</option>
                            <option value="usa">USA</option>
                            <option value="canada">Canada</option>
                            <option value="uk">UK</option>
                        </select>
                    </div>

                </fieldset>

                <h3>College Subjects</h3>

                <fieldset>
                    <legend>Select your subjects</legend>

                    <div>
                        <label for="subjects">Choose subjects:</label>
                        <br>
                        <select multiple id="subjects" name="subjects" size="5">
                            <option value="math">Mathematics</option>
                            <option value="cs" selected>Computer Science</option>
                            <option value="physics">Physics</option>
                            <option value="chemistry">Chemistry</option>
                            <option value="english">English</option>
                        </select>
                    </div>

                    <div>
                        <label for="range">Rate your interest in Computer Science:</label>
                        <input type="range" id="range" name="range" min="1" max="10" value="10">
                    </div>

                </fieldset>

                <h3>Skills Assessment</h3>
                <fieldset>
                    <legend>Assess your skills</legend>
                    <div>
                        <label for="textarea">Describe your skills:</label>
                        <br>
                        <textarea id="textarea" name="textarea" rows="7" cols="70" placeholder="List your skills here...">Basic web development skills (HTML, GitHub Pages hosting) and Java programming. Deep knowledge in hardware optimization: overclocking, undervolting, BIOS configuration, thermal management for CPUs (AMD Ryzen, Intel) and GPUs (via MSI Afterburner, GPU-Z, Curve Optimizer). Experience with PowerShell/Batch scripts and utilities (Process Lasso, ThrottleStop, G-Helper, ISLC) for maximum Windows OS performance tuning and competitive gaming (CS2, Warzone).</textarea>
                    </div>

                    <div>
                        <label for="file">Upload your resume:</label>
                        <input type="file" id="file" name="file">
                    </div>
                    
                    <div>
                        <label for="color">Pick your favorite color:</label>
                        <input type="color" id="color" name="color" value="#1a1a1a">
                    </div>

                    <div>
                        <label for="time">Preferred study time:</label>
                        <input type="time" id="time" name="time">
                    </div>
                    <div>
                        <button type="submit">Submit Survey</button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <br>
    <hr>
    <footer>
        <small>&copy; Student card by Dmytro Koshovskyi. All rights reserved.</small>
    </footer>

</body>
</html>
